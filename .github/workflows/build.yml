name: CI & Build MPP

on:
  push:
    branches:
      - main
      - dev
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build & Artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build MPP and Extensions
        env:
          GITHUB_ACTOR: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.MORPHE_PACKAGES_TOKEN || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid :extensions:extension:assembleRelease --no-daemon

      - name: Upload Built MPP & Extension Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gboard-patches-mpp
          path: |
            patches/build/libs/*.mpp
            extensions/extension/build/outputs/aar/*.aar
          if-no-files-found: error
